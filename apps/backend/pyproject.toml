[project]
name = "steward-backend"
version = "0.1.0"
description = "StewardAI backend: FastAPI API and worker (scheduler + queue consumer) sharing one codebase."
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "apscheduler>=3.11,<4",
    "asyncpg>=0.31.0",
    "fastapi>=0.141.1",
    "feedparser>=6.0.14",
    "fpdf2>=2.8.9",
    "httpx>=0.28.1",
    "pydantic>=2.13.5",
    "pydantic-settings>=2.15.0",
    "pyjwt[crypto]>=2.15.0",
    "pypdf>=6.19.0",
    "trafilatura>=2.0",
    "uvicorn[standard]>=0.54.0",
]

[project.optional-dependencies]
# Headless-browser fallback for pages a plain request cannot read (research/browser.py).
# The Docker image installs it together with Chromium; see the Dockerfile.
browser = ["playwright>=1.50"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/steward", "src/api", "src/worker"]

[dependency-groups]
dev = [
    "mypy>=2.3.1",
    "openapi-spec-validator>=0.9.0",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.16.9",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = [
    "db: needs a Postgres superuser URL in STEWARD_TEST_DATABASE_URL (skipped otherwise)",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "ASYNC", "S", "RUF"]
ignore = ["S101"]  # assert is fine in tests and invariants

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S105", "S106"]  # hard-coded test passwords/tokens
# Fixtures copied from live Japanese/Chinese pages: full-width brackets, long HTML rows.
"tests/test_news_primary.py" = ["E501", "RUF001"]
"tests/test_news_evidence.py" = ["RUF001"]
"tests/test_news_analysis.py" = ["RUF001"]
"tests/test_news_n3.py" = ["RUF001"]  # full-width Japanese/Chinese sample text

[tool.mypy]
python_version = "3.12"
strict = true
mypy_path = "src"
packages = ["steward", "api", "worker"]
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["asyncpg", "asyncpg.*", "apscheduler", "apscheduler.*", "feedparser"]
ignore_missing_imports = true
