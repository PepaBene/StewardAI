name: News eval gate

# The news classifier benchmark against a live model, compared with the saved baseline
# (apps/backend/tests/news/baseline_benchmark.json): a language, region or event-type segment
# of 10 or more items that is clearly worse than the baseline, or pooled accuracy under 85 %,
# fails the run. It spends a few cents, so it runs weekly and on request, not on every push.
# Needs the OPENAI_API_KEY secret (the baseline model is gpt-6-luna); without it the job is skipped.

on:
  workflow_dispatch:
  schedule:
    - cron: "17 5 * * 1"

permissions:
  contents: read

jobs:
  gate:
    runs-on: ubuntu-latest
    if: ${{ vars.NEWS_EVAL_ENABLED == 'true' }}
    defaults:
      run:
        working-directory: apps/backend
    env:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv sync --locked
      - name: Golden cases for the code techniques (offline)
        run: uv run python -m steward.news.eval_analysis
      - name: Classifier benchmark against the baseline
        run: >-
          uv run python -m steward.news.eval --live --set benchmark --model gpt-6-luna
          --gate tests/news/baseline_benchmark.json
