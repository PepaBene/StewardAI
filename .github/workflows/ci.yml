name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/backend
    services:
      # Postgres 17 + pgmq 1.5.1, the version Supabase runs, so the pgmq migration is tested too.
      postgres:
        image: ghcr.io/pgmq/pg17-pgmq:v1.5.1
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      STEWARD_TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/postgres
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv sync --locked
      # The backup/restore test runs pg_dump against the Postgres 17 service; pg_dump refuses a
      # server newer than itself and the runner image ships client 16.
      - name: Install the PostgreSQL 17 client tools
        run: |
          sudo apt-get install -y postgresql-common
          sudo /usr/share/postgresql-common/pgdg/apt.postgresql.org.sh -y
          sudo apt-get install -y postgresql-client-17
          echo "/usr/lib/postgresql/17/bin" >> "$GITHUB_PATH"
        working-directory: .
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy
      - run: uv run pytest -q -rs

  # Live evals of the model-facing code (prompts, schemas, default models, eval sets): they
  # run only when a fingerprint differs from apps/backend/evals/baseline.json. Blocking when
  # the GOOGLE_API_KEY secret is set (the evals run on Gemini); see
  # steward/verify/evals_gate.py.
  evals:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/backend
    env:
      GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv sync --locked
      - run: uv run python -m steward.verify.evals_gate

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci
      # Frontend types must match the backend's committed OpenAPI spec.
      - run: npm run gen:api
      - run: git diff --exit-code -- src/lib/api/
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run build
